name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Teste
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Pré-aceitar licenças do Android SDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a43b68921783f061bdd48f52c0429f4af" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b4009044f2a1501999e7b9202a0a28f8707" >> $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: Compilar projeto web
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Dar permissão de execução ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artifact para Download
        uses: actions/upload-artifact@v4
        with:
          name: voto-facil-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
