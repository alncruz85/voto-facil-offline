name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Teste
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Platform 36 e Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: Compilar projeto web
        run: npm run build

      - name: Copiar assets para o Android (Capacitor)
        run: npx cap copy android

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses || true

      - name: Dar permissão de execução ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artifact para Download
        uses: actions/upload-artifact@v4
        with:
          name: voto-facil-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
